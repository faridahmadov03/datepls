<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hey twin wanna date?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#ffd6e7,#ffc0cb),
    radial-gradient(circle at bottom right,#ffb3d1,#ff99c8);
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:32px;
    padding:32px;
    text-align:center;
    box-shadow:
        0 20px 50px rgba(0,0,0,0.12),
        inset 0 1px 1px rgba(255,255,255,0.5);
}

h1{
    color:#222;
    font-size:2rem;
    font-weight:700;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:28px;
}

button{
    flex:1;
    border:none;
    border-radius:18px;
    padding:16px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}

.yes{
    background:white;
    color:#111;
}

.no{
    background:#ff4d8d;
    color:white;
}

#result{
    display:none;
}

.result-image{
    width:100%;
    max-width:320px;
    border-radius:24px;
    margin-top:24px;
}
</style>
</head>

<body>

<div class="card">

    <div id="question">
        <h1>hey twin wanna date?</h1>

        <div class="buttons">
            <button class="yes" onclick="showResult()">yes</button>
            <button class="no" onclick="showResult()">no</button>
        </div>
    </div>

    <div id="result">
        <h1>ohh.. You clicked NO</h1>
        <img src="result.png" alt="" class="result-image">
    </div>

</div>

<script>
function showResult() {
    document.getElementById("question").style.display = "none";
    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
